<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayı Köprüsü</title>
<style>
:root{--bg:#fdf5e8;--card:#fff;--ink:#1b2650;--org:#f2a03a;--teal:#0f8f7f;--mint:#e5f4ee;--red:#e0572c;--line:#d9d2c0;--mut:#5b6486;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a38;--card:#1f2a55;--ink:#f4efe2;--mint:#1a2748;--line:#3a4677;--mut:#a9b2d6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a38;--card:#1f2a55;--ink:#f4efe2;--mint:#1a2748;--line:#3a4677;--mut:#a9b2d6;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:820px;padding:16px}
h1{font-size:28px;margin:0;flex:1}h2{font-size:22px;text-align:center;margin:12px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:6px 12px;font-weight:700}
.btn{background:var(--org);color:#1b2650;border:3px solid var(--ink);border-radius:30px;font:inherit;font-weight:800;font-size:20px;padding:12px 30px;cursor:pointer;min-height:52px}
.btn.big{display:block;margin:18px auto;font-size:26px;padding:14px 60px}
.lnk{background:none;border:0;color:var(--teal);font:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.act{position:relative;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:18px;font:inherit;font-weight:800;font-size:18px;padding:18px 8px;cursor:pointer;min-height:140px}
.act.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--org)}.act .ic{font-size:44px;margin-top:8px}
.lock{position:absolute;right:8px;bottom:6px;font-size:22px}
.bridge{display:flex;align-items:center;margin:0 40px}.bridge:before{content:"";flex:1;order:0}
.bridge{background:linear-gradient(var(--ink),var(--ink)) center/100% 5px no-repeat;justify-content:space-between;height:24px}
.d{width:22px;height:22px;border-radius:50%;background:#aaa;border:3px solid var(--ink);display:block}.d.on{background:var(--teal)}
.lvl{text-align:center;color:var(--mut)}.foot{display:flex;justify-content:center;gap:16px}
.panel{background:var(--mint);border:4px solid var(--ink);border-radius:24px;padding:16px;margin:8px 0}
.prog{display:flex;gap:6px;flex:1;justify-content:center}.prog i{width:14px;height:14px;border-radius:50%;background:var(--line)}.prog .done{background:var(--teal)}.prog .cur{background:var(--org);transform:scale(1.3)}
.fb{min-height:64px;text-align:center;font-size:21px;font-weight:700;margin:10px 0}.fb.good{color:var(--teal)}.fb.hint{color:#b86a00}
@media (prefers-color-scheme:dark){.fb.hint{color:var(--org)}}
.opts{display:flex;gap:14px;justify-content:center;margin-top:14px}
.opt{width:84px;height:84px;border-radius:18px;border:3px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-size:40px;font-weight:800;cursor:pointer}
.opt.dim{opacity:.35}.opt.glow{background:var(--org);color:#1b2650;transform:scale(1.12)}
.bal{height:230px;position:relative}.beam{position:absolute;top:50px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:8px solid var(--ink);transition:transform .9s;transform:rotate(-4deg);transform-origin:50% 100%;padding:0 4px}
.beam.eq{transform:rotate(0)}.stand{position:absolute;bottom:0;left:50%;margin-left:-30px;border:30px solid transparent;border-bottom:110px solid var(--ink);border-top:0}
.pan{width:44%;min-height:60px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;font-size:26px;padding-bottom:6px;gap:2px}
.ap{position:relative;display:inline-block;transition:transform .3s}.ap.on{transform:scale(1.35)}.ap.on:after{content:attr(data-n);position:absolute;left:50%;top:-14px;transform:translateX(-50%);font:800 14px sans-serif;background:var(--ink);color:var(--bg);border-radius:8px;padding:0 5px}
.slot{width:62px;height:56px;border:3px solid var(--ink);background:var(--card);border-radius:10px;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--teal)}
.nl{position:relative;height:210px;margin:10px 26px;cursor:pointer;touch-action:manipulation}
.ax{position:absolute;left:0;right:0;bottom:60px;height:6px;background:var(--ink);border-radius:3px}
.tk{position:absolute;bottom:52px;width:4px;height:22px;background:var(--ink);transform:translateX(-50%)}
.lb{position:absolute;bottom:22px;transform:translateX(-50%);font-size:22px;font-weight:800;display:none}.lb.s{display:block}
.frog{position:absolute;bottom:70px;transform:translateX(-50%);font-size:54px;transition:left .8s ease-out;left:0;pointer-events:none}.frog span{display:inline-block}.frog.hop span{animation:hop .8s}
@keyframes hop{50%{transform:translateY(-70px)}}
.mk{position:absolute;bottom:20px;transform:translateX(-50%);font-size:28px;font-weight:800;color:var(--teal);text-align:center}.mk:before{content:"";position:absolute;left:50%;bottom:34px;height:50px;border-left:4px dashed var(--teal)}
.zone{position:absolute;bottom:50px;height:36px;background:rgba(242,160,58,.45);border-radius:8px;transform:translateX(-50%)}
.tgt{font-size:34px;font-weight:800}.cap{text-align:center;color:var(--mut);font-size:15px}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:330px;margin:6px auto}.fr{display:flex;flex-direction:column}
.cell{height:50px;background:var(--card);border:3px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center}
.dot{width:34px;height:34px;border-radius:50%;background:var(--red);border:3px solid #8f2f10;display:block}
.tray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:54px;margin:10px 0}.tray .dot{width:46px;height:46px;cursor:pointer;padding:0}
.cell.on{background:var(--org)}.cell.on:empty:after{content:attr(data-n);font:800 24px sans-serif;color:#1b2650}.eq2{background:var(--org);border:3px solid var(--ink);border-radius:16px;font-size:30px;font-weight:800;text-align:center;padding:10px;margin:8px auto;max-width:260px;color:#1b2650}
.chars{display:flex;justify-content:center;gap:14px;margin:12px 0}.chr{width:92px;height:92px;border-radius:50%;border:4px solid var(--line);background:var(--card);font-size:52px;cursor:pointer}.chr.sel{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0;align-items:center}
.pill{border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:24px;font:inherit;font-weight:700;padding:8px 14px;cursor:pointer}.pill.sel{background:var(--teal);color:#fff}
input{font:inherit;font-size:20px;padding:10px;border-radius:12px;border:3px solid var(--ink);background:var(--card);color:var(--ink);width:200px}
.big3{font-size:56px;text-align:center;color:var(--org)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.st{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:10px}.st b{display:block;font-size:26px;color:var(--teal)}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;border-bottom:3px solid var(--ink);margin:10px 0 4px}.bars div{flex:1;background:var(--teal);border-radius:6px 6px 0 0;text-align:center;color:#fff;font-weight:700;min-height:20px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
button:focus-visible,input:focus-visible{outline:4px solid var(--org);outline-offset:2px}
@media (max-width:560px){.opt{width:72px;height:72px}.cards{gap:8px}.act{font-size:15px}}
.cf{position:fixed;left:50%;top:45%;font-size:30px;pointer-events:none;z-index:9;animation:cf 1.3s ease-out forwards}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let S;try{S=JSON.parse(localStorage.getItem('sk'))}catch(e){}
S=S||{name:'',ch:'🐸',lvl:2,vol:true,stars:0,un:{t:1,k:0,o:0},rounds:[],log:[],setup:0,rs:0};
S.lvl=Math.min(S.lvl||2,3);const save=()=>{try{localStorage.setItem('sk',JSON.stringify(S))}catch(e){}};
const NM={t:'Terazi Dengesi',k:'Sayı Kurbağası',o:'Onluk Yuva'},IC={t:'⚖️',k:'🐸',o:'🔟'},LV=['1–5','1–10','1–20'];
let sel='t',R={},tmp={};
function sp(t){if(!S.vol||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}catch(e){}}
function show(h){$('#app').innerHTML=h;scrollTo(0,0)}
function msg(t,c){const f=$('#fb');if(f){f.className='fb '+(c||'');f.textContent=t}if(c=='good')cel();else if(c=='hint')snd(1);sp(t)}
function home(){
 if(!S.setup)return prof();
 show(`<div class="top"><h1>Sayı Köprüsü</h1><div class="chip">★ ${S.stars}</div><button class="chip" onclick="prof()" style="font:inherit;color:inherit;cursor:pointer">${S.ch} ${esc(S.name)}</button></div>
 <div class="cards">${['t','k','o'].map(a=>`<button class="act ${a==sel?'sel':''}" onclick="pick('${a}')">${NM[a]}<div class="ic">${IC[a]}</div>${S.un[a]?'':'<span class="lock">🔒</span>'}</button>`).join('')}</div>
 <div class="bridge"><i class="d on"></i><i class="d ${S.un.k?'on':''}"></i><i class="d ${S.un.o?'on':''}"></i></div>
 <p id="fb" class="fb hint"></p>
 <button class="btn big" onclick="start(sel,1)">Oyna</button>
 <p class="cap">Düzeyini seç</p><div class="row">${LV.map((l,i)=>`<button class="pill ${S.lvl==i+1?'sel':''}" onclick="S.lvl=${i+1};S.rs=S.rounds.length;save();home()">${l}</button>`).join('')}</div>
 <div class="foot"><button class="lnk" onclick="prof()">Profil</button><button class="lnk" onclick="pin()">Ebeveyn / Öğretmen</button></div>`);
}
function pick(a){if(!S.un[a]){msg('Önce bir önceki etkinliği bitir','hint');return}sel=a;home()}
function prof(keep){
 if(!keep)tmp={ch:S.ch,lvl:S.lvl,vol:S.vol};
 show(`<h2>Merhaba! Arkadaşını seç</h2><div class="chars">${['🐸','🐰','🐱'].map(c=>`<button class="chr ${c==tmp.ch?'sel':''}" onclick="tmp.ch='${c}';prof2()">${c}</button>`).join('')}</div>
 <div class="row"><label>Adın<br><input id="nm" maxlength="14" value="${esc(S.name)}" placeholder="Adın"></label></div>
 <p class="cap">Başlangıç düzeyi (uzman seçer)</p><div class="row">${LV.map((l,i)=>`<button class="pill ${tmp.lvl==i+1?'sel':''}" onclick="tmp.lvl=${i+1};prof2()">Düzey ${i+1} · ${l}</button>`).join('')}</div>
 <div class="row"><button class="pill ${tmp.vol?'sel':''}" onclick="tmp.vol=!tmp.vol;prof2()">Ses: ${tmp.vol?'açık':'kapalı'}</button></div>
 <button class="btn big" onclick="saveProf()">${S.setup?'Kaydet':'Kısa oyunla başla'}</button>`);
}
function prof2(){const n=$('#nm')?$('#nm').value:S.name;S.name=n;prof(1)}
function saveProf(){const n=($('#nm').value||'').trim();if(!n){$('#nm').focus();return}
 const first=!S.setup;Object.assign(S,{name:n,ch:tmp.ch,lvl:tmp.lvl,vol:tmp.vol,setup:1});save();first?start('t',1,true):home()}
function start(a,n,as){R={a,n,i:0,ok:0,lvl:S.lvl,st:0,as};next()}
function next(){if(R.i>=R.n)return fin();({t:qT,k:qK,o:qO})[R.a]()}
function frame(title,body){
 show(`<div class="top"><button class="lnk" onclick="speechSynthesis&&speechSynthesis.cancel();home()">⬅ Köprü</button><div class="prog">${Array.from({length:R.n},(_,i)=>`<i class="${i<R.i?'done':i==R.i?'cur':''}"></i>`).join('')}</div><div class="chip">★ ${R.st}</div></div>
 <h2>${title}</h2>${body}<div id="fb" class="fb"></div><div id="nx" style="text-align:center"></div>`);sp(title);R.h=0;R.lock=0;R.t0=Date.now()}
function fin1(h,e){const s=h==0?3:h==1?2:1;R.st+=s;S.stars+=s;if(h==0)R.ok++;
 S.log.push({a:R.a,l:R.lvl,h,t:Math.round((Date.now()-R.t0)/1000),e:e==null?null:e,ok:h==0?1:0,d:Date.now()});save();
 $('#nx').innerHTML='<button class="btn" id="go">Devam ➜</button>';$('#go').onclick=()=>{R.i++;next()};$('#go').focus()}
const stars=h=>'★'.repeat(h==0?3:h==1?2:1);
/* Terazi */
function qT(){
 const mx=[5,10,20][R.lvl-1];let a=rnd(1,mx),b=0;if(R.lvl==3&&rnd(0,1)){b=rnd(1,9);a=rnd(1,Math.min(10,mx-b))}
 const n=a+b,o=new Set([n]);while(o.size<3){const v=n+rnd(-3,3);if(v>=1&&v<=Math.max(mx,n))o.add(v)}
 R.n0=n;const op=[...o].sort(()=>Math.random()-.5);
 const ap=(c,k)=>Array.from({length:k},()=>`<span class="ap">${c}</span>`).join('');
 frame('Terazi dengede olsun. Doğru rakamı seç',`<div class="panel"><div class="bal"><div class="beam" id="bm"><div class="pan">${ap('🍎',a)}${b?'<b>+</b>'+ap('🍏',b):''}</div><div class="pan"><div class="slot" id="sl">?</div></div></div><div class="stand"></div></div></div>
 <div class="opts">${op.map(v=>`<button class="opt" data-v="${v}" onclick="chT(${v},this)">${v}</button>`).join('')}</div>`);
}
function chT(v,el){const n=R.n0;
 if(v==n){$('#sl').textContent=v;$('#bm').classList.add('eq');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);msg('Harika! '+n+' elma, '+n+' rakamı '+stars(R.h),'good');fin1(R.h);return}
 R.h++;el.classList.add('dim');
 if(R.h==1){msg('Neredeyse yaklaştın! Birlikte bakalım. Elmalar tek tek yanıyor.','hint');document.querySelectorAll('.ap').forEach((e,i)=>setTimeout(()=>{e.dataset.n=i+1;e.classList.add('on')},i*450))}
 else if(R.h==2){msg('Bu sayıya bak, sayı bloğu işaretlendi.','hint');document.querySelector(`.opt[data-v="${n}"]`).classList.add('glow')}
 else{const c=document.querySelector(`.opt[data-v="${n}"]`);c.classList.add('glow');$('#sl').textContent=n;$('#bm').classList.add('eq');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);msg('Doğru çözüm: '+n+' elma, '+n+' rakamı. Birlikte öğreniyoruz!','hint');fin1(3)}}
/* Kurbağa */
function qK(){
 const L=R.lvl,mx=[10,10,20][L-1],t=rnd(1,mx-1);R.t=t;R.mx=mx;R.tol=[0,0,1][L-1];
 let tk='',lb='';const st=mx==100?10:1;
 for(let i=0;i<=mx;i+=st){const p=i/mx*100;tk+=`<i class="tk" style="left:${p}%"></i>`;lb+=`<span class="lb s" style="left:${p}%;font-size:${mx>10?'clamp(10px,2.4vw,16px)':'22px'}">${i}</span>`}
 frame('Hedef sayıya zıpla!',`<div class="panel"><div class="tgt">Hedef: ${t}</div><div class="nl" id="nl" onclick="chK(event)"><div class="ax"></div>${tk}${lb}<div class="frog" id="fg"><span>${S.ch}</span></div></div><p class="cap">Kurbağanın zıplamasını istediğin yere dokun</p></div>`);
}
function chK(ev){if(R.lock)return;R.lock=1;const r=$('#nl').getBoundingClientRect(),mx=R.mx;
 let v=Math.max(0,Math.min(mx,Math.round((ev.clientX-r.left)/r.width*mx)));
 const f=$('#fg');f.style.left=(v/mx*100)+'%';f.classList.remove('hop');void f.offsetWidth;f.classList.add('hop');
 const e=Math.abs(v-R.t);
 setTimeout(()=>{
  if(e<=R.tol){R.lock=1;mark();$('#fg').style.left=(R.t/mx*100)+'%';msg(e==0?'Harika! Sayı '+R.t+' tam burada '+stars(R.h):'Çok yakın! Sayı '+R.t+' burada. Fark: '+e,'good');fin1(R.h,Math.round(e/mx*100));return}
  R.h++;
  if(R.h<3)R.lock=0;if(R.h==1){document.querySelectorAll('.lb').forEach(l=>{if(Math.abs(+l.textContent-R.t)<=2)l.style.color='var(--org)'});msg('Neredeyse yaklaştın! Hedefe yakın rakamlar turuncu yandı, tekrar dene.','hint')}
  else if(R.h==2){const z=document.createElement('div');z.className='zone';z.style.left=(R.t/mx*100)+'%';z.style.width=Math.max(8,(2*Math.max(1,R.tol)+1)/mx*100)+'%';$('#nl').appendChild(z);msg('Turuncu alana bak. Sayı orada, tekrar dene.','hint')}
  else{R.lock=1;mark();$('#fg').style.left=(R.t/mx*100)+'%';msg('Doğru yer: '+R.t+'. Senin yerin '+v+', fark: '+e+'. Birlikte öğreniyoruz!','hint');fin1(3,Math.round(e/mx*100))}
 },850)}
function mark(){const m=document.createElement('div');m.className='mk';m.style.left=(R.t/R.mx*100)+'%';m.textContent=R.t;$('#nl').appendChild(m)}
/* Onluk Yuva */
function qO_old(){
 const two=R.lvl>=3,cap=two?20:10,a=two?rnd(11,19):rnd(1,9);R.p=a;R.cap=cap;R.a0=a;
 const cells=f=>Array.from({length:10},(_,i)=>`<div class="cell" id="c${f*10+i}">${f*10+i<a?'<i class="dot"></i>':''}</div>`).join('');
 frame('Noktaları yuvaya yerleştir',`<div class="panel"><div class="frame">${cells(0)}</div>${two?`<div class="frame">${cells(1)}</div>`:''}<p class="cap">Kalan nokta</p><div class="tray" id="tr">${Array.from({length:cap-a},()=>`<button class="dot" aria-label="nokta" onclick="chO(this)"></button>`).join('')}</div><div id="eqb"></div></div>`);
}
function chO_old(el){const i=R.p;el.remove();$('#c'+i).innerHTML='<i class="dot"></i>';R.p++;
 if(R.p>=R.cap){$('#eqb').innerHTML=`<div class="eq2">${R.a0} + ${R.cap-R.a0} = ${R.cap}</div>`;msg('Çerçeve doldu! '+R.cap+' oldu ★★★','good');fin1(0)}}
/* Onluk Yuva (yeni): önce kaç eksik, sonra yerleştir */
function qO(){
 const two=R.lvl>=3,cap=two?20:10,a=two?rnd(11,19):rnd(1,9),need=cap-a;
 R.cap=cap;R.a0=a;R.p=a;R.need=need;R.ph=1;
 const o=new Set([need]);while(o.size<3){const v=need+rnd(-3,3);if(v>=1&&v<=9)o.add(v)}
 const cells=f=>Array.from({length:10},(_,i)=>{const k=f*10+i;return `<div class="cell" id="c${k}">${k<a?'<i class="dot"></i>':''}</div>`}).join('');
 frame(cap+(two?"'ye":"'a")+' tamamlamak için kaç nokta lazım?',`<div class="panel"><div class="frame">${cells(0)}</div>${two?`<div class="frame">${cells(1)}</div>`:''}<div class="opts">${[...o].sort(()=>Math.random()-.5).map(v=>`<button class="opt" data-v="${v}" onclick="chQ(${v},this)">${v}</button>`).join('')}</div><p class="cap" id="tc">Boş yuvalara bak, kaç nokta eksik?</p><div class="tray" id="tr"></div><div id="eqb"></div></div>`);
}
function p2(){R.ph=2;document.querySelectorAll('.opt').forEach(b=>b.disabled=true);$('#tc').textContent='Noktalara dokun, boş yuvalara yerleşsinler';$('#tr').innerHTML=Array.from({length:R.need},()=>'<button class="dot" aria-label="nokta" onclick="chO(this)"></button>').join('')}
function chQ(v,el){const need=R.need;if(R.ph!=1)return;
 if(v==need){msg('Doğru! '+need+' nokta lazım. Şimdi noktaları yuvalara yerleştir.','good');p2();return}
 R.h++;el.classList.add('dim');el.disabled=true;
 if(R.h==1){msg('Neredeyse yaklaştın! Birlikte bakalım. Boş yuvalar tek tek yanıyor.','hint');for(let i=0;i<need;i++)setTimeout(()=>{const c=$('#c'+(R.a0+i));if(c&&!c.firstChild){c.dataset.n=i+1;c.classList.add('on')}},i*450)}
 else if(R.h==2){msg('Bu sayıya bak, sayı bloğu işaretlendi.','hint');document.querySelector(`.opt[data-v="${need}"]`).classList.add('glow')}
 else{document.querySelector(`.opt[data-v="${need}"]`).classList.add('glow');msg('Doğru cevap: '+need+'. Şimdi yuvaları birlikte dolduralım.','hint');p2()}}
function chO(el){if(R.ph!=2)return;const i=R.p,c=$('#c'+i);el.remove();c.classList.remove('on');c.innerHTML='<i class="dot"></i>';R.p++;
 if(R.p>=R.cap){R.ph=3;$('#eqb').innerHTML=`<div class="eq2">${R.a0} + ${R.need} = ${R.cap}</div>`;msg('Çerçeve doldu! '+R.a0+' ve '+R.need+', toplam '+R.cap+' '+stars(R.h),'good');fin1(R.h)}}
/* Bitiş ve uyarlama */
function fin(){
 const acc=R.ok/R.n;let note='';const nxt={t:'k',k:'o'}[R.a];let opened='';if(nxt&&!R.as&&!S.un[nxt]){S.un[nxt]=1;opened=nxt;sel=nxt}
 if(R.as){if(acc<.5&&S.lvl>1){S.lvl--;note='Düzeyin sana uygun hale getirildi.'}else note='Başlangıç değerlendirmesi tamam!'}
 else{S.rounds.push({a:R.a,acc,l:R.lvl,d:Date.now()});if(R.a=='t')S.un.k=1;if(R.a=='k')S.un.o=1;
  const rs=S.rounds.slice(S.rs||0);
  if(rs.length>=3&&rs.slice(-3).every(r=>r.acc>=.8)&&S.lvl<3){S.lvl++;S.rs=S.rounds.length;note='Süper! Yeni düzey açıldı: '+LV[S.lvl-1]}
  else if(rs.length>=2&&rs.slice(-2).every(r=>r.acc<.5)&&S.lvl>1){S.lvl--;S.rs=S.rounds.length;note='Kısa mola zamanı. Bir sonraki oyun biraz daha kolay olacak.'}
  if(R.a=='t'&&S.un.k&&sel=='t'){} }
 if(opened)note+=' 🔓 Yeni oyun açıldı: '+NM[opened];save();const s=R.st>=R.n*2?'Harika bir köprü geçişi!':'Güzel çalıştın!';sp(s);
 show(`<h2>${s}</h2><div class="big3">${'★'.repeat(Math.min(3,Math.max(1,Math.round(R.st/R.n))))}</div><p class="fb good">Bu turda ${R.st} yıldız kazandın.<br>${note}</p><button class="btn big" onclick="${opened?`start('${opened}',1)`:'home()'}">${opened?NM[opened]+' ➜':'Köprüye dön'}</button>${opened?'<div class="foot"><button class="lnk" onclick="home()">Köprüye dön</button></div>':''}`);
}
/* Ebeveyn / öğretmen */
function pin(){show(`<h2>Ebeveyn ve öğretmen</h2><div class="row"><input id="pw" type="password" placeholder="Şifre" inputmode="numeric"><button class="btn" onclick="chk()">Gir</button></div><p id="fb" class="fb"></p><p class="cap">Demo şifresi: 1234</p><div class="foot"><button class="lnk" onclick="home()">⬅ Köprü</button></div>`)}
function chk(){if($('#pw').value=='1234')rep();else $('#fb').textContent='Şifre doğru değil, tekrar dene.'}
function rep(){
 const L=S.log,m=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
 if(!L.length){show(`<h2>${esc(S.name)} · Haftalık rapor</h2><p class="cap">Henüz veri yok. Çocuk oynadıkça burada görünür.</p><div class="foot"><button class="lnk" onclick="home()">⬅ Köprü</button></div>`);return}
 const f=L[0].d,wk={};L.forEach(x=>{const w=Math.floor((x.d-f)/6048e5);(wk[w]=wk[w]||[]).push(x.ok)});
 const bars=Object.keys(wk).map(w=>{const p=Math.round(m(wk[w])*100);return`<div style="height:${Math.max(p,8)}%">${p}<br><small>${+w+1}. hf</small></div>`}).join('');
 const ke=L.filter(x=>x.e!=null).map(x=>x.e);
 const rows=['t','k','o'].map(a=>{const q=L.filter(x=>x.a==a);return`<tr><td>${NM[a]}</td><td>${q.length}</td><td>${q.length?'%'+Math.round(m(q.map(x=>x.ok))*100):'-'}</td></tr>`}).join('');
 show(`<h2>${esc(S.name)} · Haftalık rapor</h2>
 <div class="stat"><div class="st">Doğruluk<b>%${Math.round(m(L.map(x=>x.ok))*100)}</b></div><div class="st">İpucu / soru<b>${m(L.map(x=>x.h)).toFixed(1)}</b></div><div class="st">Yanıt süresi<b>${Math.round(m(L.map(x=>x.t)))} sn</b></div><div class="st">Sayı doğrusu hatası<b>${ke.length?'%'+Math.round(m(ke)):'-'}</b></div></div>
 <p class="cap">Doğru cevap oranı (%), ilk denemede</p><div class="bars">${bars}</div>
 <table><tr><th>Etkinlik</th><th>Soru</th><th>Doğruluk</th></tr>${rows}</table>
 <p class="cap">Güncel düzey: ${S.lvl} (${LV[S.lvl-1]}) · ${S.rounds.length} tur tamamlandı</p>
 <div class="foot"><button class="lnk" onclick="home()">⬅ Köprü</button><button class="lnk" onclick="if(confirm('Tüm veriler silinsin mi?')){try{localStorage.removeItem('sk')}catch(e){}location.reload()}">Verileri sıfırla</button></div>`);
}
/* Onluk Yuva v2: önce eksik miktarı düşün, sonra yuvaya yerleştir (bu tanımlar yukarıdakilerin yerini alır) */
function qO(){
 const two=R.lvl>=3,cap=two?20:10,a=two?rnd(11,19):rnd(1,9),b=cap-a;
 R.cap=cap;R.a0=a;R.b0=b;R.p=a;
 const o=new Set([b]);while(o.size<3){const v=b+rnd(-3,3);if(v>=1&&v<=cap-1)o.add(v)}
 const op=[...o].sort(()=>Math.random()-.5);
 const cells=f=>Array.from({length:10},(_,i)=>{const k=f*10+i;return`<div class="cell" id="c${k}">${k<a?'<i class="dot"></i>':''}</div>`}).join('');
 frame(cap+' olması için kaç nokta eksik?',`<div class="panel"><div class="frame">${cells(0)}</div>${two?`<div class="frame">${cells(1)}</div>`:''}<div class="tray" id="tr"></div><div id="eqb"></div></div><div class="opts" id="op">${op.map(v=>`<button class="opt" data-v="${v}" onclick="qOa(${v},this)">${v}</button>`).join('')}</div>`);
}
function qOa(v,el){
 const all=()=>document.querySelectorAll('#op .opt'),ok=()=>document.querySelector(`#op .opt[data-v="${R.b0}"]`);
 if(v==R.b0){all().forEach(b=>b.disabled=true);el.classList.add('glow');fillTray();msg('Doğru! '+R.b0+' nokta eksik. Şimdi noktaları boş yuvalara yerleştir.','good');return}
 R.h++;el.classList.add('dim');
 if(R.h==1){msg('Neredeyse yaklaştın! Boş yuvalara bak, tek tek sayıyoruz.','hint');for(let k=0;k<R.b0;k++){const c=$('#c'+(R.a0+k));setTimeout(()=>{c.style.background='var(--org)';c.style.fontSize='26px';c.style.fontWeight='800';c.textContent=k+1},k*450)}}
 else if(R.h==2){msg('Bu sayıya bak, işaretlendi.','hint');ok().classList.add('glow')}
 else{all().forEach(b=>b.disabled=true);ok().classList.add('glow');fillTray();msg('Birlikte dolduralım: '+R.b0+' nokta eksik.','hint');for(let k=0;k<R.b0;k++)setTimeout(()=>{const t=$('#tr .dot');if(t)chO(t)},700+k*450)}
}
function fillTray(){$('#tr').innerHTML=Array.from({length:R.b0},()=>`<button class="dot" aria-label="nokta" onclick="chO(this)"></button>`).join('')}
function chO(el){const c=$('#c'+R.p);if(!c)return;el.remove();c.removeAttribute('style');c.innerHTML='<i class="dot"></i>';R.p++;
 if(R.p>=R.cap){$('#eqb').innerHTML=`<div class="eq2">${R.a0} + ${R.b0} = ${R.cap}</div>`;msg('Çerçeve doldu! '+R.cap+' oldu '+stars(R.h),'good');fin1(R.h)}}
/* Onluk Yuva v3: işlem altta, n boş yuva, n+1 nokta; çocuk yeteri kadar basıyor */
function qO(){
 const cap=[5,10,20][R.lvl-1],n=R.lvl==3?rnd(11,20):rnd(3,cap),a=rnd(Math.ceil(n/3),Math.floor(2*n/3)),b=n-a;
 R.n0=n;R.a0=a;R.p=a;
 const cells=(f,t)=>Array.from({length:t-f},(_,i)=>`<div class="cell" id="c${f+i}">${f+i<a?'<i class="dot"></i>':''}</div>`).join('');
 frame('Noktaları boş yuvalara yerleştir',`<div class="panel"><p class="cap">Boş yuva: ${b}</p><div class="frame">${cells(0,Math.min(n,10))}</div>${n>10?`<div class="frame">${cells(10,n)}</div>`:''}<p class="cap">Noktalar</p><div class="tray" id="tr">${Array.from({length:b+1},()=>`<button class="dot" aria-label="nokta" onclick="chO(this)"></button>`).join('')}</div><div class="eq2">${a} + ${b} = ${n}</div></div>`);
}
function chO(el){
 if(R.p>=R.n0){el.style.opacity=.3;msg('Yuvalar dolu! Fazla nokta gerekmedi.','hint');return}
 const c=$('#c'+R.p);el.remove();c.innerHTML=`<i class="dot" style="${R.p>=R.a0?'background:#2d7fd1;border-color:#1b4f8f':''}"></i>`;R.p++;
 if(R.p>=R.n0){msg('Harika! '+R.a0+' + '+(R.n0-R.a0)+' = '+R.n0+' ★★★','good');fin1(0)}
}
function APL(f,s){return `<svg viewBox="0 0 24 24" width="28" height="28"><circle cx="12" cy="13.5" r="9" fill="${f}" stroke="${s}" stroke-width="1.5"/><ellipse cx="8.5" cy="9.5" rx="2.6" ry="1.6" fill="#fff" opacity=".45"/><path d="M12 5c0-2 1.5-3.2 3.2-3.5" stroke="#2d8a3e" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`}
function av(c,s){return c=='🐸'?`<svg viewBox="0 0 100 70" width="${s*1.4}" height="${s}" role="img" aria-label="kurbağa"><ellipse cx="26" cy="56" rx="16" ry="7" fill="#2d8a3a" transform="rotate(-20 26 56)"/><ellipse cx="50" cy="40" rx="34" ry="21" fill="#4caf50" transform="rotate(-12 50 40)"/><ellipse cx="49" cy="44" rx="19" ry="10" fill="#cfeeb0" transform="rotate(-12 49 44)"/><ellipse cx="62" cy="58" rx="12" ry="5" fill="#2d8a3a" transform="rotate(20 62 58)"/><circle cx="68" cy="17" r="9" fill="#fff" stroke="#3a9a44" stroke-width="2"/><circle cx="83" cy="14" r="9" fill="#fff" stroke="#3a9a44" stroke-width="2"/><circle cx="70" cy="19" r="4" fill="#1b2650"/><circle cx="85" cy="16" r="4" fill="#1b2650"/></svg>`:c}
function cel(){snd(2);if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 for(let i=0;i<22;i++){const e=document.createElement('span');e.className='cf';e.textContent=['⭐','✨','🎉','🌟'][i%4];const an=Math.random()*6.28,d=120+Math.random()*180;
 e.style.setProperty('--x',Math.cos(an)*d+'px');e.style.setProperty('--y',(Math.sin(an)*d-80)+'px');e.style.setProperty('--r',rnd(-200,200)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
let AC;function snd(k){if(!S.vol)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const ns=k==2?[523,659,784]:[392];ns.forEach((f,i)=>{const t=AC.currentTime+i*.12,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.35)})}catch(e){}}
home();
</script></body></html>
